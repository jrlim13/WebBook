<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#432818" />
    <meta name="color-scheme" content="light" />
    <title>WebBook — A Reader</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/glass.css" />
    <link rel="stylesheet" href="styles/reader.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%236f1d1b'/><path d='M14 14h28a8 8 0 0 1 8 8v28H22a8 8 0 0 1-8-8V14z' fill='%23ffe6a7'/><path d='M22 14v36' stroke='%2399582a' stroke-width='2'/></svg>"
    />
  </head>
  <body>
    <!-- Decorative background layers -->
    <div class="bg" aria-hidden="true">
      <div class="bg__gradient"></div>
      <div class="bg__blob bg__blob--1"></div>
      <div class="bg__blob bg__blob--2"></div>
      <div class="bg__blob bg__blob--3"></div>
      <div class="bg__grain"></div>
    </div>

    <main id="app" class="app" aria-label="Book reader">
      <!-- Top Liquid Glass toolbar -->
      <header class="toolbar toolbar--top glass" data-chrome>
        <button
          class="icon-btn"
          id="btn-back"
          type="button"
          aria-label="Library"
          title="Library"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M15 6l-6 6 6 6"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <div class="toolbar__title">
          <span class="toolbar__book-title" id="book-title">Loading…</span>
          <span class="toolbar__book-author" id="book-author"></span>
        </div>
        <div class="toolbar__actions">
          <button
            class="icon-btn"
            id="btn-aa"
            type="button"
            aria-label="Reading settings"
            aria-haspopup="dialog"
            aria-expanded="false"
            title="Reading settings"
          >
            <span class="aa">Aa</span>
          </button>
          <button
            class="icon-btn"
            id="btn-bookmark"
            type="button"
            aria-label="Bookmark page"
            aria-pressed="false"
            title="Bookmark"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M7 4h10a1 1 0 0 1 1 1v16l-6-4-6 4V5a1 1 0 0 1 1-1z"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </header>

      <!-- Book stage -->
      <section class="stage" id="stage" aria-label="Book pages">
        <div class="stage__desk" aria-hidden="true"></div>
        <div class="book" id="book"></div>

        <!-- Tap zones overlay (above book corners are handled by StPageFlip) -->
        <div class="tap-zones" aria-hidden="true">
          <button
            class="tap-zone tap-zone--left"
            data-action="prev"
            aria-label="Previous page"
            tabindex="-1"
          ></button>
          <button
            class="tap-zone tap-zone--center"
            data-action="toggle-chrome"
            aria-label="Toggle controls"
            tabindex="-1"
          ></button>
          <button
            class="tap-zone tap-zone--right"
            data-action="next"
            aria-label="Next page"
            tabindex="-1"
          ></button>
        </div>

        <!-- Off-screen measurement node used by paginator -->
        <div
          class="measurer"
          id="measurer"
          aria-hidden="true"
          tabindex="-1"
        ></div>

        <!-- Loading state -->
        <div class="loader" id="loader" role="status" aria-live="polite">
          <span class="loader__dot"></span>
          <span class="loader__dot"></span>
          <span class="loader__dot"></span>
          <span class="sr-only">Preparing your book…</span>
        </div>
      </section>

      <!-- Bottom Liquid Glass toolbar -->
      <footer class="toolbar toolbar--bottom glass" data-chrome>
        <div class="progress">
          <div class="progress__meta">
            <span class="progress__chapter" id="progress-chapter"></span>
            <span class="progress__pages" id="progress-pages"></span>
          </div>
          <div class="progress__track" role="presentation">
            <div class="progress__fill" id="progress-fill"></div>
          </div>
        </div>
        <div class="toolbar__nav">
          <button
            class="icon-btn"
            id="btn-prev"
            type="button"
            aria-label="Previous page"
            title="Previous"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M15 6l-6 6 6 6"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button
            class="icon-btn"
            id="btn-next"
            type="button"
            aria-label="Next page"
            title="Next"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M9 6l6 6-6 6"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </footer>

      <!-- Settings sheet (Aa) -->
      <div
        class="sheet glass"
        id="settings-sheet"
        role="dialog"
        aria-modal="false"
        aria-labelledby="settings-title"
        hidden
      >
        <header class="sheet__header">
          <h2 class="sheet__title" id="settings-title">Reading</h2>
          <button
            class="icon-btn"
            id="btn-close-settings"
            type="button"
            aria-label="Close settings"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6 6l12 12M18 6L6 18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </header>
        <div class="sheet__body">
          <div class="control-row">
            <label class="control-label" for="font-size">Text size</label>
            <div class="seg" role="group" aria-labelledby="font-size">
              <button
                class="seg__btn"
                type="button"
                data-font-size="-1"
                aria-label="Decrease text size"
              >
                <span class="aa aa--sm">A</span>
              </button>
              <button
                class="seg__btn"
                type="button"
                data-font-size="+1"
                aria-label="Increase text size"
              >
                <span class="aa aa--lg">A</span>
              </button>
            </div>
          </div>
          <div class="control-row">
            <label class="control-label" for="line-height">Line spacing</label>
            <div class="seg" role="radiogroup" aria-labelledby="line-height">
              <button
                class="seg__btn"
                type="button"
                data-line-height="1.45"
                role="radio"
                aria-checked="false"
              >
                Tight
              </button>
              <button
                class="seg__btn"
                type="button"
                data-line-height="1.6"
                role="radio"
                aria-checked="true"
              >
                Normal
              </button>
              <button
                class="seg__btn"
                type="button"
                data-line-height="1.8"
                role="radio"
                aria-checked="false"
              >
                Open
              </button>
            </div>
          </div>
          <div class="control-row">
            <label class="control-label" for="paper-tone">Paper</label>
            <div class="seg" role="radiogroup" aria-labelledby="paper-tone">
              <button
                class="seg__btn"
                type="button"
                data-paper="cream"
                role="radio"
                aria-checked="true"
              >
                Cream
              </button>
              <button
                class="seg__btn"
                type="button"
                data-paper="white"
                role="radio"
                aria-checked="false"
              >
                White
              </button>
              <button
                class="seg__btn"
                type="button"
                data-paper="sepia"
                role="radio"
                aria-checked="false"
              >
                Sepia
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="sheet-scrim" id="sheet-scrim" hidden></div>
    </main>

    <!-- StPageFlip via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
